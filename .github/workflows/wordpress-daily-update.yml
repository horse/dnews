name: WordPress daily update

on:
  pull_request:
    branches:
      - main
    paths:
      - '.publish/request.yml'

permissions:
  contents: read

concurrency:
  group: wordpress-daily-update-shinkiji
  cancel-in-progress: false

jobs:
  update:
    if: >-
      startsWith(github.head_ref, 'ops/wordpress-daily-update-') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out update request
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests PyYAML Markdown

      - name: Validate Japanese edition
        run: ruby tests/test_japanese_edition.rb

      - name: Run publisher tests
        run: python -m unittest tests/test_publish_wordpress.py -v

      - name: Confirm secret is available
        env:
          WP_APP_PASSWORD: ${{ secrets.shinkiji }}
        run: test -n "$WP_APP_PASSWORD"

      - name: Update Japanese daily page
        env:
          WP_BASE_URL: https://shinkiji.com
          WP_USERNAME: shinkiji
          WP_APP_PASSWORD: ${{ secrets.shinkiji }}
        run: |
          python tools/publish_wordpress.py \
            --request .publish/request.yml \
            --report wordpress-publish-report.json

      - name: Verify daily page and all 26 article links
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.request
          from pathlib import Path

          report = json.loads(Path('wordpress-publish-report.json').read_text(encoding='utf-8'))
          assert report['count'] == 1, report
          result = report['results'][0]
          assert result['status'] == 'publish', result
          daily_url = result['link']

          with urllib.request.urlopen(daily_url, timeout=30) as response:
              assert response.status == 200
              html = response.read().decode('utf-8', errors='replace')

          urls = sorted(set(re.findall(r'https://shinkiji\.com/[a-z0-9-]+/', html)))
          article_urls = [url for url in urls if not url.endswith('/japan-daily-2026-07-31/')]
          assert len(article_urls) == 26, (len(article_urls), article_urls)

          for url in article_urls:
              request = urllib.request.Request(url, headers={'User-Agent': 'dnews-link-check/1.0'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  assert response.status == 200, (url, response.status)

          print(json.dumps({'daily_url': daily_url, 'linked_articles': len(article_urls)}, ensure_ascii=False))
          PY

      - name: Upload non-secret report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-daily-update-report
          path: wordpress-publish-report.json
          if-no-files-found: ignore
          retention-days: 7
