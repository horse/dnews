name: Test expanded daily edition

on:
  pull_request:
    paths:
      - '_posts/**'
      - '_includes/**'
      - '_layouts/**'
      - 'daily/**'
      - 'tests/test_tags.sh'
      - 'tags.md'
      - 'index.md'
      - 'assets/main.scss'
      - '_config.yml'
      - 'tools/**'
      - '.github/workflows/generate-expanded-daily.yml'
      - '.github/workflows/tags-ci.yml'

permissions:
  contents: write
  pages: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Write and compose expanded edition
        run: |
          for script in \
            tools/write_social_reports.py \
            tools/write_other_reports_a.py \
            tools/write_other_reports_b.py \
            tools/finalize_expanded_daily.py
          do
            if [ -f "$script" ]; then
              python3 "$script"
            fi
          done

      - name: Commit generated edition to feature branch
        if: github.actor != 'github-actions[bot]'
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "feat: generate expanded July 31 daily edition"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Read GitHub Pages configuration
        uses: actions/configure-pages@v5

      - name: Build with GitHub Pages Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Run expanded-edition acceptance checks
        run: SKIP_BUILD=1 bash tests/test_tags.sh
