name: Apply bilingual edition package

on:
  push:
    branches:
      - 'news/**'
    paths:
      - '.edition-package-*.ready'

permissions:
  contents: write

concurrency:
  group: apply-edition-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate package marker
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t markers < <(find . -maxdepth 1 -type f -name '.edition-package-*.ready' -printf '%f\n' | sort)
          if [[ ${#markers[@]} -ne 1 ]]; then
            echo "Expected exactly one edition marker, found ${#markers[@]}" >&2
            exit 1
          fi
          marker="${markers[0]}"
          if [[ ! "$marker" =~ ^\.edition-package-([0-9]{4}-[0-9]{2}-[0-9]{2})\.ready$ ]]; then
            echo "Invalid marker name: $marker" >&2
            exit 1
          fi
          edition_date="${BASH_REMATCH[1]}"
          expected_sha="$(tr -d '[:space:]' < "$marker")"
          if [[ ! "$expected_sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Marker must contain a SHA-256 digest" >&2
            exit 1
          fi
          echo "marker=$marker" >> "$GITHUB_OUTPUT"
          echo "edition_date=$edition_date" >> "$GITHUB_OUTPUT"
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"

      - name: Assemble, verify and safely extract edition
        env:
          MARKER: ${{ steps.package.outputs.marker }}
          EDITION_DATE: ${{ steps.package.outputs.edition_date }}
          EXPECTED_SHA: ${{ steps.package.outputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.edition-package-"$EDITION_DATE".tar.xz.b64.part*)
          if [[ ${#parts[@]} -lt 1 ]]; then
            echo "No package parts found" >&2
            exit 1
          fi
          printf '%s\n' "${parts[@]}" | sort -V | xargs cat > /tmp/edition.tar.xz.b64
          base64 --decode /tmp/edition.tar.xz.b64 > /tmp/edition.tar.xz
          actual_sha="$(sha256sum /tmp/edition.tar.xz | awk '{print $1}')"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "Package digest mismatch: $actual_sha != $EXPECTED_SHA" >&2
            exit 1
          fi
          python - <<'PY'
          import os
          import pathlib
          import tarfile

          edition = os.environ['EDITION_DATE']
          allowed_exact = {
              f'daily/{edition}.md',
              f'japanese/daily/{edition}.md',
              f'japanese/edition-{edition}.yml',
          }
          allowed_prefixes = (
              f'_posts/{edition}-',
              f'japanese/posts/{edition}-',
          )
          with tarfile.open('/tmp/edition.tar.xz', 'r:xz') as archive:
              members = archive.getmembers()
              if not members:
                  raise SystemExit('Edition package is empty')
              for member in members:
                  name = member.name
                  path = pathlib.PurePosixPath(name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'Unsafe archive path: {name}')
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f'Unsupported archive entry: {name}')
                  if not (name in allowed_exact or name.startswith(allowed_prefixes)):
                      raise SystemExit(f'Path outside edition allowlist: {name}')
              archive.extractall('.')
          PY
          rm -f "$MARKER" "${parts[@]}" /tmp/edition.tar.xz /tmp/edition.tar.xz.b64

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check PyYAML Markdown requests

      - name: Validate generated edition
        env:
          EDITION_DATE: ${{ steps.package.outputs.edition_date }}
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests/test_edition.py tests/test_publish_wordpress.py -v
          python tools/validate_edition.py --edition-date "$EDITION_DATE"

      - name: Commit validated edition
        env:
          EDITION_DATE: ${{ steps.package.outputs.edition_date }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _posts daily japanese/posts japanese/daily japanese/edition-*.yml
          git add -u
          if git diff --cached --quiet; then
            echo 'No edition changes to commit'
            exit 0
          fi
          git commit -m "Add ${EDITION_DATE} bilingual morning edition"
          git push origin HEAD
