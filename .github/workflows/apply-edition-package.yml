name: Apply bilingual edition package

on:
  push:
    branches:
      - 'news/**'
    paths:
      - '.edition-package-*.tar.gz.b64'

permissions:
  contents: write

concurrency:
  group: apply-edition-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate and validate package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(find . -maxdepth 1 -type f -name '.edition-package-*.tar.gz.b64' -printf '%f\n' | sort)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "Expected exactly one edition package, found ${#packages[@]}" >&2
            exit 1
          fi
          package="${packages[0]}"
          if [[ ! "$package" =~ ^\.edition-package-([0-9]{4}-[0-9]{2}-[0-9]{2})\.tar\.gz\.b64$ ]]; then
            echo "Invalid package name: $package" >&2
            exit 1
          fi
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "edition_date=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: Decode and safely extract edition
        env:
          PACKAGE: ${{ steps.package.outputs.package }}
          EDITION_DATE: ${{ steps.package.outputs.edition_date }}
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode "$PACKAGE" > /tmp/edition.tar.gz
          python - <<'PY'
          import os
          import pathlib
          import tarfile

          edition = os.environ['EDITION_DATE']
          allowed_exact = {
              f'daily/{edition}.md',
              f'japanese/daily/{edition}.md',
              f'japanese/edition-{edition}.yml',
          }
          allowed_prefixes = (
              f'_posts/{edition}-',
              f'japanese/posts/{edition}-',
          )
          with tarfile.open('/tmp/edition.tar.gz', 'r:gz') as archive:
              members = archive.getmembers()
              if not members:
                  raise SystemExit('Edition package is empty')
              for member in members:
                  name = member.name
                  path = pathlib.PurePosixPath(name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'Unsafe archive path: {name}')
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f'Unsupported archive entry: {name}')
                  if not (name in allowed_exact or name.startswith(allowed_prefixes)):
                      raise SystemExit(f'Path outside edition allowlist: {name}')
              archive.extractall('.')
          PY
          rm -f "$PACKAGE" /tmp/edition.tar.gz

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check PyYAML Markdown requests

      - name: Validate generated edition
        env:
          EDITION_DATE: ${{ steps.package.outputs.edition_date }}
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests/test_edition.py tests/test_publish_wordpress.py -v
          python tools/validate_edition.py --edition-date "$EDITION_DATE"

      - name: Commit validated edition
        env:
          EDITION_DATE: ${{ steps.package.outputs.edition_date }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _posts daily japanese/posts japanese/daily japanese/edition-*.yml
          git add -u
          if git diff --cached --quiet; then
            echo 'No edition changes to commit'
            exit 0
          fi
          git commit -m "Add ${EDITION_DATE} bilingual morning edition"
          git push origin HEAD
