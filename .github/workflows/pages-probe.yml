name: Probe published Pages site

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Allow initial Pages deployment to settle
        run: sleep 45

      - name: Probe public site
        id: probe
        shell: bash
        run: |
          set +e
          site_url="https://horse.github.io/dnews/"
          body_file="$(mktemp)"
          http_code="$(curl --location --silent --show-error --output "$body_file" --write-out '%{http_code}' --max-time 30 "$site_url")"
          curl_exit=$?
          set -e

          if grep -q '从日本的信息洪流中' "$body_file"; then
            content_match=true
          else
            content_match=false
          fi

          if [ "$curl_exit" -eq 0 ] && [ "$http_code" = "200" ] && [ "$content_match" = true ]; then
            published=true
          else
            published=false
          fi

          mkdir -p status
          cat > status/pages.json <<EOF
          {
            "checked_at_utc": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "url": "$site_url",
            "curl_exit": $curl_exit,
            "http_code": "$http_code",
            "expected_content_found": $content_match,
            "published": $published
          }
          EOF

      - name: Record probe result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/pages.json
          git commit -m "chore: record Pages publication probe [skip ci]" || exit 0
          git push
