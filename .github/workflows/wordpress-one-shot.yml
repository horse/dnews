name: WordPress one-shot publisher

on:
  pull_request:
    branches:
      - main
    paths:
      - '.publish/request.yml'
      - 'tools/publish_wordpress.py'
      - 'tests/test_publish_wordpress.py'

permissions:
  contents: read

concurrency:
  group: wordpress-one-shot-shinkiji
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      startsWith(github.head_ref, 'ops/wordpress-request-') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed request
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install publisher dependencies
        run: python -m pip install --disable-pip-version-check requests PyYAML Markdown

      - name: Run publisher unit tests
        run: python -m unittest tests/test_publish_wordpress.py -v

      - name: Confirm secret is available without printing it
        env:
          WP_APP_PASSWORD: ${{ secrets.shinkiji }}
        run: test -n "$WP_APP_PASSWORD"

      - name: Apply requested WordPress status
        env:
          WP_BASE_URL: https://shinkiji.com
          WP_USERNAME: shinkiji
          WP_APP_PASSWORD: ${{ secrets.shinkiji }}
        run: |
          python tools/publish_wordpress.py \
            --request .publish/request.yml \
            --report wordpress-publish-report.json

      - name: Verify all public URLs without authentication
        run: |
          python - <<'PY'
          import json
          import time
          import requests

          path = 'wordpress-publish-report.json'
          with open(path, encoding='utf-8') as fh:
              report = json.load(fh)

          failures = []
          for item in report['results']:
              link = item['link']
              status_code = None
              error = None
              for attempt in range(1, 5):
                  try:
                      response = requests.get(
                          link,
                          timeout=30,
                          allow_redirects=True,
                          headers={'User-Agent': 'dnews-public-verifier/1.0'},
                      )
                      status_code = response.status_code
                      if status_code == 200:
                          break
                      error = f'HTTP {status_code}'
                  except requests.RequestException as exc:
                      error = str(exc)
                  time.sleep(attempt)
              item['public_check'] = {
                  'status_code': status_code,
                  'ok': status_code == 200,
                  'error': None if status_code == 200 else error,
              }
              if status_code != 200:
                  failures.append({'slug': item['slug'], 'link': link, 'error': error})

          with open(path, 'w', encoding='utf-8') as fh:
              json.dump(report, fh, ensure_ascii=False, indent=2)

          if failures:
              raise SystemExit(json.dumps(failures, ensure_ascii=False))
          print(f"Verified {len(report['results'])} public URLs with HTTP 200")
          PY

      - name: Upload non-secret publication report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-publish-report
          path: wordpress-publish-report.json
          if-no-files-found: ignore
          retention-days: 7
