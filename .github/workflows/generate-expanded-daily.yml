name: Generate expanded daily edition

on:
  push:
    branches:
      - feature/expanded-daily-20260731
    paths:
      - tools/generate_expanded_daily.py
      - .github/workflows/generate-expanded-daily.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/expanded-daily-20260731
          fetch-depth: 0

      - name: Generate expanded edition
        run: python3 tools/generate_expanded_daily.py

      - name: Commit generated edition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: generate expanded July 31 daily edition"
          git push origin HEAD:feature/expanded-daily-20260731
