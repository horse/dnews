name: Normalize WordPress publish default

on:
  push:
    branches:
      - main
    paths:
      - '.ops/default-publish.trigger'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check requests PyYAML Markdown

      - name: Make publish the Japanese WordPress default
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          article_paths = sorted((root / 'japanese' / 'posts').glob('*.md'))
          article_paths += sorted((root / 'japanese' / 'daily').glob('*.md'))
          assert len(article_paths) == 27, len(article_paths)

          for path in article_paths:
              text = path.read_text(encoding='utf-8')
              if '  status: draft\n' in text:
                  text = text.replace('  status: draft\n', '  status: publish\n', 1)
              else:
                  assert '  status: publish\n' in text, path
              path.write_text(text, encoding='utf-8')

          replacements = {
              Path('tools/publish_wordpress.py'): [
                  ('wp.get("status", "draft")', 'wp.get("status", "publish")'),
              ],
              Path('tests/test_japanese_edition.rb'): [
                  ('wordpress.status must be draft', 'wordpress.status must be publish'),
                  ("wordpress['status'] == 'draft'", "wordpress['status'] == 'publish'"),
              ],
              Path('japanese/README.md'): [
                  ('`wordpress.status: draft`', '`wordpress.status: publish`'),
                  ('WordPressへの同期後も編集確認を経てから公開する。', 'WordPressへの同期時に標準で公開する。下書きが必要な場合だけ明示的に `draft` を指定する。'),
              ],
              Path('japanese/WORDPRESS.md'): [
                  ('# WordPress下書き契約', '# WordPress公開契約'),
                  ('`draft` を新規作成する。', '`publish` で新規作成する。'),
                  ('初期運用では全投稿を下書きとして同期し、WordPress上で確認してから公開する。', '標準運用では全投稿を `publish` で同期する。編集確認が必要な記事だけ、個別に `draft` を指定する。'),
              ],
              Path('docs/superpowers/specs/2026-08-01-japanese-original-edition-design.md'): [
                  ('WordPressの下書き原稿', 'WordPressの公開原稿'),
                  ('`wordpress.status: draft`', '`wordpress.status: publish`'),
              ],
              Path('docs/superpowers/plans/2026-08-01-japanese-original-edition.md'): [
                  ('Japanese WordPress drafts', 'Japanese WordPress publications'),
                  ('`wordpress.status` remains `draft`', '`wordpress.status` defaults to `publish`'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old in text:
                      text = text.replace(old, new)
                  else:
                      assert new in text, (path, old, new)
              path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_publish_wordpress.py')
          test_text = test_path.read_text(encoding='utf-8')
          marker = '    def test_post_lookup_action_is_idempotent(self):\n'
          new_test = '''    def test_make_post_payload_defaults_to_publish(self):
        data = {
            "title": "見出し",
            "slug": "sample-story",
            "excerpt": "要約",
            "wordpress": {"comment_status": "closed"},
        }
        payload = make_post_payload(data, "<p>本文</p>", [10], [20])
        self.assertEqual(payload["status"], "publish")

'''
          if 'test_make_post_payload_defaults_to_publish' not in test_text:
              assert marker in test_text
              test_text = test_text.replace(marker, new_test + marker)
              test_path.write_text(test_text, encoding='utf-8')
          PY

      - name: Verify Japanese metadata and publisher
        run: |
          ! grep -R "status: draft" japanese/posts japanese/daily
          ruby tests/test_japanese_edition.rb
          python -m unittest tests/test_publish_wordpress.py -v

      - name: Commit normalized defaults
        run: |
          if git diff --quiet; then
            echo "Defaults already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: default Japanese WordPress publishing to public"
          git push origin HEAD:main
