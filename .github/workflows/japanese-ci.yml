name: Test Japanese original edition

on:
  pull_request:
    paths:
      - 'japanese/**'
      - 'tests/test_japanese_edition.rb'
      - '_config.yml'
      - '.github/workflows/japanese-ci.yml'

permissions:
  contents: read
  pages: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Japanese manuscripts and WordPress metadata
        run: ruby tests/test_japanese_edition.rb

      - name: Read GitHub Pages configuration
        uses: actions/configure-pages@v5

      - name: Build Chinese GitHub Pages site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Confirm Japanese WordPress drafts are excluded from Pages
        run: test ! -e _site/japanese
