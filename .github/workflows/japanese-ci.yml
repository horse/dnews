name: Test Japanese WordPress edition

on:
  pull_request:
    paths:
      - 'japanese/**'
      - '_posts/**'
      - 'daily/**'
      - 'tools/**'
      - 'tests/**'
      - '_config.yml'
      - '.github/workflows/japanese-ci.yml'

permissions:
  contents: read
  pages: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML Markdown requests

      - name: Validate bilingual manuscripts and WordPress metadata
        run: |
          python -m unittest tests/test_edition.py tests/test_publish_wordpress.py -v
          python tools/validate_edition.py --all

      - name: Read GitHub Pages configuration
        uses: actions/configure-pages@v5

      - name: Build Chinese GitHub Pages site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Confirm Japanese WordPress sources are excluded from Pages
        run: test ! -e _site/japanese
