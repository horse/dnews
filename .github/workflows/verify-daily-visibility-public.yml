name: Verify daily visibility on public sites

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'verify/daily-visibility-public'
    runs-on: ubuntu-latest
    steps:
      - name: Verify public Chinese and Japanese editions
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.parse
          import urllib.request

          def fetch(url, attempts=15):
              last_error = None
              for attempt in range(attempts):
                  try:
                      request = urllib.request.Request(url, headers={'User-Agent': 'dnews-public-visibility-check/1.0'})
                      with urllib.request.urlopen(request, timeout=30) as response:
                          body = response.read().decode('utf-8', errors='replace')
                          if response.status != 200:
                              raise RuntimeError(f'{url}: HTTP {response.status}')
                          return body
                  except Exception as exc:
                      last_error = exc
                      time.sleep(min(2 ** attempt, 15))
              raise last_error

          cn_home_url = 'https://horse.github.io/dnews/'
          cn_archive_url = 'https://horse.github.io/dnews/archive/'
          cn_0802_url = 'https://horse.github.io/dnews/daily/2026-08-02/'
          cn_0803_url = 'https://horse.github.io/dnews/daily/2026-08-03/'
          wp_0802_url = 'https://shinkiji.com/japan-daily-2026-08-02/'
          wp_0803_url = 'https://shinkiji.com/japan-daily-2026-08-03/'

          home = fetch(cn_home_url)
          archive = fetch(cn_archive_url)
          cn_0802 = fetch(cn_0802_url)
          cn_0803 = fetch(cn_0803_url)
          wp_0802 = fetch(wp_0802_url)
          wp_0803 = fetch(wp_0803_url)

          assert '2026年8月3日' in home, 'latest date missing from Chinese homepage'
          assert '24篇报道' in home, 'actual latest count missing from Chinese homepage'
          assert '26篇报道' not in home, 'stale count remains on Chinese homepage'
          assert '/dnews/daily/2026-08-03/' in archive, 'August 3 missing from Chinese archive'
          assert '/dnews/daily/2026-08-02/' in archive, 'August 2 missing from Chinese archive'
          assert '/dnews/daily/2026-07-31/' in archive, 'July 31 missing from Chinese archive'
          assert '日本新闻早报｜2026年8月2日' in cn_0802, 'August 2 Chinese daily title missing'
          assert '日本新闻早报｜2026年8月3日' in cn_0803, 'August 3 Chinese daily title missing'
          assert '日本ニュース朝刊｜2026-08-02' in wp_0802, 'August 2 Japanese daily title missing'
          assert '日本ニュース朝刊｜2026-08-03' in wp_0803, 'August 3 Japanese daily title missing'

          rest = {}
          for slug in ['japan-daily-2026-08-02', 'japan-daily-2026-08-03']:
              api = 'https://shinkiji.com/wp-json/wp/v2/posts?' + urllib.parse.urlencode({
                  'slug': slug,
                  'status': 'publish',
                  '_fields': 'id,date,slug,status,link,title',
              })
              payload = json.loads(fetch(api))
              assert len(payload) == 1, (slug, payload)
              assert payload[0]['status'] == 'publish', payload[0]
              rest[slug] = payload[0]

          print(json.dumps({
              'chinese': {
                  'homepage_http': 200,
                  'archive_http': 200,
                  'daily_2026_08_02_http': 200,
                  'daily_2026_08_03_http': 200,
                  'homepage_count': 24,
                  'archive_dates': ['2026-07-31', '2026-08-02', '2026-08-03'],
              },
              'wordpress': {
                  'daily_2026_08_02_http': 200,
                  'daily_2026_08_03_http': 200,
                  'posts': rest,
              },
          }, ensure_ascii=False))
          PY
