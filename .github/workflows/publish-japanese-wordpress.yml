name: Publish Japanese WordPress edition

on:
  push:
    branches:
      - main
    paths:
      - 'japanese/posts/**'
      - 'japanese/daily/**'
      - 'japanese/edition-*.yml'
  workflow_dispatch:
    inputs:
      edition_date:
        description: YYYY-MM-DD; empty uses the latest manifest
        required: false
        type: string
      mode:
        description: Content set to synchronize
        required: true
        default: all
        type: choice
        options:
          - all
          - posts
          - daily
          - one
      slug:
        description: Required only when mode is one
        required: false
        type: string
      status:
        description: Final WordPress status
        required: true
        default: publish
        type: choice
        options:
          - publish
          - draft

permissions:
  contents: read

concurrency:
  group: publish-japanese-wordpress
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests PyYAML Markdown

      - name: Determine edition dates
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_EDITION_DATE: ${{ inputs.edition_date }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY' > edition-dates.txt
          import os
          import sys
          from pathlib import Path

          root = Path('.').resolve()
          sys.path.insert(0, str((root / 'tools').resolve()))
          from edition import git_changed_paths, latest_edition_date, parse_changed_edition_dates

          if os.environ.get('EVENT_NAME') == 'workflow_dispatch':
              date = (os.environ.get('INPUT_EDITION_DATE') or '').strip() or latest_edition_date(root)
              dates = [date]
          else:
              paths = git_changed_paths(root, os.environ.get('BEFORE_SHA', ''), os.environ['CURRENT_SHA'])
              dates = parse_changed_edition_dates(root, paths)
              if not dates:
                  raise SystemExit(f'No edition date found in changed Japanese files: {paths}')
          for date in dates:
              print(date)
          PY
          test -s edition-dates.txt
          cat edition-dates.txt

      - name: Validate every edition before writing WordPress
        run: |
          python -m unittest tests/test_edition.py tests/test_publish_wordpress.py -v
          while IFS= read -r edition_date; do
            python tools/validate_edition.py --edition-date "$edition_date"
          done < edition-dates.txt

      - name: Publish only the selected editions
        env:
          WP_BASE_URL: https://shinkiji.com
          WP_USERNAME: shinkiji
          WP_APP_PASSWORD: ${{ secrets.shinkiji }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_SLUG: ${{ inputs.slug }}
          INPUT_STATUS: ${{ inputs.status }}
        run: |
          test -n "$WP_APP_PASSWORD"
          mkdir -p wordpress-reports
          final_status="${INPUT_STATUS:-publish}"
          mode="${INPUT_MODE:-all}"
          while IFS= read -r edition_date; do
            EDITION_DATE="$edition_date" MODE="$mode" SLUG="${INPUT_SLUG:-}" STATUS="$final_status" python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          request = {
              'edition_date': os.environ['EDITION_DATE'],
              'mode': os.environ['MODE'],
              'status_override': os.environ['STATUS'],
          }
          if os.environ.get('SLUG'):
              request['slug'] = os.environ['SLUG']
          Path('wordpress-request.yml').write_text(
              yaml.safe_dump(request, allow_unicode=True, sort_keys=False),
              encoding='utf-8',
          )
          PY
            python tools/publish_wordpress.py \
              --request wordpress-request.yml \
              --report "wordpress-reports/${edition_date}.json"
          done < edition-dates.txt

      - name: Verify reports and public URLs
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_STATUS: ${{ inputs.status }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.request
          from pathlib import Path
          import yaml

          sys.path.insert(0, str((Path('.') / 'tools').resolve()))
          from wordpress_counts import expected_publication_count

          status = (os.environ.get('INPUT_STATUS') or 'publish') if os.environ.get('EVENT_NAME') == 'workflow_dispatch' else 'publish'
          mode = (os.environ.get('INPUT_MODE') or 'all') if os.environ.get('EVENT_NAME') == 'workflow_dispatch' else 'all'
          reports = []
          for path in sorted(Path('wordpress-reports').glob('*.json')):
              report = json.loads(path.read_text(encoding='utf-8'))
              edition_date = report['edition_date']
              manifest = yaml.safe_load(Path(f'japanese/edition-{edition_date}.yml').read_text(encoding='utf-8'))
              expected = expected_publication_count(mode, len(manifest['posts']))
              assert report['count'] == expected, (path, report['count'], expected)
              assert all(item['status'] == status for item in report['results']), report
              reports.append(report)

              if status != 'publish':
                  continue
              for item in report['results']:
                  url = item['link']
                  last_error = None
                  for attempt in range(6):
                      try:
                          request = urllib.request.Request(url, headers={'User-Agent': 'dnews-public-check/2.0'})
                          with urllib.request.urlopen(request, timeout=30) as response:
                              assert response.status == 200, (url, response.status)
                          last_error = None
                          break
                      except Exception as exc:
                          last_error = exc
                          time.sleep(min(2 ** attempt, 10))
                  if last_error:
                      raise last_error

              if mode in {'all', 'daily'}:
                  expected_urls = [f"https://shinkiji.com/{item['slug']}/" for item in manifest['posts']]
                  daily = next(item for item in report['results'] if item['path'].startswith('japanese/daily/'))
                  request = urllib.request.Request(daily['link'], headers={'User-Agent': 'dnews-public-check/2.0'})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      html = response.read().decode('utf-8', errors='replace')
                  missing = [url for url in expected_urls if url not in html]
                  assert not missing, missing
          assert reports, 'No WordPress reports produced'
          print(json.dumps({'reports': len(reports), 'status': status}, ensure_ascii=False))
          PY

      - name: Upload publication reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-publish-report
          path: wordpress-reports/*.json
          if-no-files-found: ignore
          retention-days: 14
