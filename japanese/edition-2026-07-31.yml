  title: 熊本地方のM7.1地震、死者34人に　自動車・半導体工場の停止が九州の供給網を直撃
  excerpt: 7月28日に熊本県熊本地方で起きたマグニチュード7.1の地震は、31日までに死者34人となった。自動車や半導体の工場では停止と点検が続き、復旧は設備の再調整と部品物流の回復に左右される。
  path: japanese/posts/2026-08-01-kumamoto-earthquake-supply-chain.md
- story_id: 2026-07-31-boj-holds-rate-inflation-risk
  slug: boj-holds-rate-inflation-risk
  section: core
  importance: 2
  title: 日銀、政策金利1％を据え置き　物価上振れへの警戒を強め、追加利上げの選択肢を維持
  excerpt: 日本銀行は7月31日の金融政策決定会合で政策金利を1％に据え置いた。決定は8対1で、高田創審議委員は1.25％への引き上げを提案。円安やエネルギー価格を含む物価上振れリスクへの警戒が強まった。
  path: japanese/posts/2026-08-01-boj-holds-rate-inflation-risk.md
- story_id: 2026-07-31-japan-yen-intervention-estimate
  slug: japan-yen-intervention-estimate
  section: core
  importance: 3
  title: 円買い介入は最大8.2兆円規模か　日銀の資金需給から市場が推計、確定額は8月公表
  excerpt: 7月末の円買い・ドル売り介入は最大8.2兆円規模だった可能性がある。日銀の資金需給予想と民間予想の差から算出された市場推計で、財務省が公表する正式な月次額を待つ必要がある。
  path: japanese/posts/2026-08-01-japan-yen-intervention-estimate.md
- story_id: 2026-07-31-us-treasury-yen-readiness
  slug: us-treasury-yen-readiness
  section: core
  importance: 4
  title: 米財務省、円相場への介入準備を銀行に通知　7月31日時点で実取引は未確認
  excerpt: 米財務省はニューヨーク連銀を通じ、複数の銀行に円市場へ介入する可能性に備えるよう通知した。日米協調への警戒から円は上昇したが、7月31日夜の時点で米国による実際の円買いは確認されていなかった。
  path: japanese/posts/2026-08-01-us-treasury-yen-readiness.md
- story_id: 2026-07-31-japan-national-intelligence-bureau
  slug: japan-national-intelligence-bureau
  section: core
  importance: 5
  title: 国家情報局が発足、約700人で省庁横断の分析を担う　権限と監督は今後の焦点
  excerpt: 政府は7月31日、内閣情報調査室を改組した国家情報局を発足させた。約700人規模で国家情報会議の事務局を担い、警察、防衛、外務などの情報を統合する。対外情報機関や監督制度は引き続き検討課題となる。
  path: japanese/posts/2026-08-01-japan-national-intelligence-bureau.md
- story_id: 2026-07-31-tokyo-cpi-july
  slug: tokyo-cpi-july
  section: core
