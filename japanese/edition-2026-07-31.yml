  excerpt: 熊本市は地震後、博物館、美術館、体育施設、老人福祉センター、創業支援施設などの休館と行事中止を相次いで公表した。安全点検の長期化は、住民の日常を支える公共サービスの空白につながる。
  path: japanese/posts/2026-08-01-kumamoto-public-facility-closures.md
