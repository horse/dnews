  title: 東京都区部の7月物価、2.0％上昇　食料と交通の値上がりを保育料無償化が押し下げ
  excerpt: 総務省が7月31日に公表した東京都区部の消費者物価指数は前年同月比2.0％上昇した。生鮮食品を除く指数は1.9％。食料、家賃、交通が上昇する一方、保育所保育料の低下が総合指数を押し下げた。
  path: japanese/posts/2026-08-01-tokyo-cpi-july.md
- story_id: 2026-07-31-japan-labor-june
  slug: japan-labor-june
  section: core
  importance: 7
  title: 6月の完全失業率は2.5％で横ばい　就業者増の一方、失業者は11か月連続増加
  excerpt: 総務省の労働力調査によると、6月の完全失業率は季節調整値で2.5％と前月から横ばいだった。就業者は前年同月比17万人増えた一方、完全失業者も2万人増え、11か月連続の増加となった。
  path: japanese/posts/2026-08-01-japan-labor-june.md
- story_id: 2026-07-31-japan-industrial-output-june
  slug: japan-industrial-output-june
  section: core
  importance: 8
  title: 6月の鉱工業生産は1.3％上昇　7、8月は増産予測も熊本地震が下振れ要因
  excerpt: 経済産業省の6月鉱工業生産指数は前月比1.3％上昇した。製造工業生産予測調査では7月1.2％、8月4.5％の増産を見込むが、熊本地震による自動車・半導体の停止は予測の下振れ要因となる。
  path: japanese/posts/2026-08-01-japan-industrial-output-june.md
