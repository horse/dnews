  title: 熊本地震、断水と猛暑が避難生活を圧迫　復旧の焦点は水・衛生・暑さ対策へ
  excerpt: 熊本地震の発生から数日がたち、被災地では断水、停電、災害ごみ、猛暑が重なる。熊本市は井戸水の提供や特別収集を始め、避難所の飲料水、衛生、熱中症対策が復旧の中心課題となった。
  path: japanese/posts/2026-08-01-kumamoto-water-heat-evacuation.md
