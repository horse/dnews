  excerpt: 熊本赤十字病院は7月29日から31日まで一般外来と予定入院を休止し、救命救急センターを地震負傷者と急病患者の受け入れに集中させた。災害時には、通常医療の中断をいかに短くするかも地域医療の課題となる。
  path: japanese/posts/2026-08-01-kumamoto-red-cross-emergency-care.md
